<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Centre de Modération</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #050505; color: #f5f5f5; padding: 40px 20px; }
        
        .top-bar { max-width: 1200px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; background: #121212; padding: 10px 20px; border-radius: 12px; border: 1px solid #262626; }
        .top-bar select { background: #000; color: #fff; border: 1px solid #363636; padding: 8px 15px; border-radius: 8px; outline: none; }
        .role-desc { font-size: 13px; color: #0095f6; font-weight: 600; }
        
        .header { max-width: 1200px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; }
        .header h1 { font-size: 28px; font-weight: 700; }
        
        .tabs { display: flex; gap: 15px; flex-wrap: wrap; }
        .tab-btn { background: transparent; border: none; color: #a8a8a8; font-size: 16px; font-weight: 600; cursor: pointer; padding-bottom: 5px; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #fff; border-bottom: 2px solid #0095f6; }
        
        .controls-bar { max-width: 1200px; margin: 0 auto 20px; display: none; gap: 10px; }
        .controls-bar input, .controls-bar select { flex: 1; padding: 12px 15px; border-radius: 12px; border: 1px solid #363636; background: #121212; color: white; outline: none; }
        .controls-bar input:focus, .controls-bar select:focus { border-color: #0095f6; }

        .reports-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .report-card { background: #121212; border: 1px solid #262626; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
        .card-header { padding: 15px 20px; border-bottom: 1px solid #262626; display: flex; justify-content: space-between; align-items: flex-start; background: #0a0a0a; }
        
        .badge-motif { background: rgba(237, 73, 86, 0.15); color: #ed4956; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-ia { background: rgba(0, 149, 246, 0.15); color: #0095f6; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-success { background: rgba(92, 184, 92, 0.15); color: #5cb85c; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-warning { background: rgba(240, 173, 78, 0.15); color: #f0ad4e; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;}
        .badge-warning:hover { opacity: 0.7; }
        
        .card-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; gap: 15px; }
        .context-box { background: #1a1a1a; border-left: 3px solid #363636; padding: 12px; font-size: 12px; color: #a8a8a8; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; border-radius: 0 8px 8px 0; }
        
        .post-preview { background: #000; border: 1px solid #262626; border-radius: 12px; padding: 15px; }
        .post-author { font-size: 14px; font-weight: 600; margin-bottom: 10px; display: inline-block; text-decoration: none; color: #0095f6; cursor: pointer; }
        .post-author:hover { text-decoration: underline; }
        .post-text { font-size: 14px; line-height: 1.4; color: #e0e0e0; margin-bottom: 10px; }
        .post-image { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; border: 1px solid #262626; }
        
        .card-actions { padding: 15px 20px; border-top: 1px solid #262626; display: flex; flex-wrap: wrap; gap: 10px; }
        .btn { flex: 1; min-width: 45%; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.8; }
        .btn-danger { background: #ed4956; color: white; }
        .btn-warning { background: #363636; color: #f0ad4e; }
        .btn-success { background: #5cb85c; color: white; }
        .btn-primary { background: #0095f6; color: white; }
        
        .empty-state { text-align: center; padding: 60px; color: #a8a8a8; grid-column: 1 / -1; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal { background: #121212; border: 1px solid #262626; border-radius: 16px; padding: 25px; width: 450px; max-height: 80vh; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal h3 { font-size: 18px; border-bottom: 1px solid #262626; padding-bottom: 10px; }
        .modal input, .modal select { background: #000; border: 1px solid #363636; color: white; padding: 12px; border-radius: 8px; width: 100%; outline: none; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
        
        .reports-list-details { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .reports-list-details li { background: #000; padding: 15px; border-radius: 8px; border: 1px solid #262626; font-size: 13px; line-height: 1.5; }
        
        #toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 3000; }
        .toast { background: #5cb85c; color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; opacity: 0; transform: translateY(20px); transition: all 0.3s ease; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: #ed4956; }
    </style>
</head>
<body>

<div class="top-bar">
    <div>
        <span style="font-size: 13px; color: #a8a8a8; margin-right: 10px;">Simulation :</span>
        <select id="role-simulator" onchange="changeRole()">
            <option value="admin">👨‍💻 Admin (Comptes, Rôles, Contenus)</option>
            <option value="moderateur">🛡️ Modérateur (Contenus uniquement)</option>
        </select>
    </div>
    <div id="role-indicator" class="role-desc">Mode Administrateur</div>
</div>

<div class="header">
    <h1>🚨 Modération</h1>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('pending')" id="tab-pending">En attente</button>
        <button class="tab-btn" onclick="switchTab('history')" id="tab-history">Historique</button>
        <button class="tab-btn" onclick="switchTab('banned')" id="tab-banned">Bannis</button>
        <button class="tab-btn" onclick="switchTab('users')" id="tab-users">Tous les utilisateurs</button>
    </div>
</div>

<div class="controls-bar" id="filters-pending">
    <select id="filter-type" onchange="renderReports()">
        <option value="all">Tous les signalements</option>
        <option value="ia">🤖 Signalements IA uniquement</option>
        <option value="human">👤 Signalements Humains uniquement</option>
    </select>
    <select id="sort-type" onchange="renderReports()">
        <option value="date">Plus récents d'abord</option>
        <option value="count">Plus signalés d'abord</option>
    </select>
</div>

<div class="controls-bar" id="search-container">
    <input type="text" id="search-input" placeholder="🔍 Rechercher un pseudo..." onkeyup="handleSearch()">
</div>

<div class="reports-grid" id="reports-list"></div>
<div id="toast-container"></div>

<!-- Modal Détails des Signalements -->
<div id="reports-modal-overlay" class="modal-overlay">
    <div class="modal">
        <h3>📄 Détails des signalements</h3>
        <ul class="reports-list-details" id="reports-detail-list"></ul>
        <button class="btn btn-warning" onclick="closeModals()">Fermer</button>
    </div>
</div>

<!-- Modal Voir le Post d'Origine -->
<div id="original-post-modal-overlay" class="modal-overlay">
    <div class="modal">
        <h3>👁️ Contexte du commentaire</h3>
        <div class="post-preview" id="original-post-content">
            <!-- Injecté en JS -->
        </div>
        <button class="btn btn-warning" onclick="closeModals()">Fermer</button>
    </div>
</div>

<!-- Modal Ban -->
<div id="ban-modal-overlay" class="modal-overlay">
    <div class="modal">
        <h3>🔨 Bannir l'utilisateur</h3>
        <input type="text" id="ban-motif" placeholder="Motif officiel..." autocomplete="off"/>
        <select id="ban-duration">
            <option value="7">1 Semaine</option>
            <option value="30">1 Mois</option>
            <option value="lifetime">Définitivement (À vie)</option>
        </select>
        <div class="modal-actions">
            <button class="btn btn-warning" onclick="closeModals()">Annuler</button>
            <button class="btn btn-danger" onclick="confirmBan()">Confirmer</button>
        </div>
    </div>
</div>

<!-- Modal Gestion de Compte -->
<div id="stats-modal-overlay" class="modal-overlay">
    <div class="modal">
        <h3 id="stats-title">Gestion de Compte</h3>
        <div id="role-badge" style="margin-bottom: 10px;"></div>
        <ul class="reports-list-details" style="gap:5px;">
            <li>Signalements reçus : <strong id="stat-reports" style="color:#ed4956">0</strong></li>
            <li>Posts modérés : <strong id="stat-deleted" style="color:#ed4956">0</strong></li>
            <li>Bannissements passés : <strong id="stat-bans" style="color:#ed4956">0</strong></li>
        </ul>
        <div id="admin-actions" style="margin-top: 15px; display: none; flex-direction: column; gap: 10px;">
            <div style="border-top: 1px solid #262626; padding-top: 10px; font-size: 13px; color: #a8a8a8;">Actions Admin :</div>
            <div id="role-management"></div>
            <button class="btn btn-danger" id="btn-delete-account">Supprimer le compte</button>
        </div>
        <button class="btn btn-warning" onclick="closeModals()" style="margin-top: 10px;">Fermer</button>
    </div>
</div>

<script>
    let currentTab = 'pending';
    let allReports = [];
    let currentFilteredReports = []; // Sauvegarde les filtres actifs pour les modales
    let allUsersList = [];
    let allBannedUsers = [];
    let userToBanId = null;
    
    function getCurrentRole() { return document.getElementById('role-simulator').value; }
    
    function changeRole() { 
        const role = getCurrentRole();
        document.getElementById('role-indicator').innerText = (role === 'admin') ? 'Mode Administrateur' : 'Mode Modérateur';
        document.getElementById('role-indicator').style.color = (role === 'admin') ? '#ed4956' : '#0095f6';
        document.getElementById('tab-users').style.display = (role === 'admin') ? 'inline-block' : 'none';
        
        if (role === 'moderateur' && currentTab === 'users') switchTab('pending');
        else switchTab(currentTab); 
    }
    
    async function apiFetch(url, options = {}) {
        options.headers = { ...options.headers, 'X-User-Role': getCurrentRole() };
        return fetch(url, options);
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        
        document.getElementById('filters-pending').style.display = (tab === 'pending') ? 'flex' : 'none';
        document.getElementById('search-container').style.display = (tab === 'banned' || tab === 'users') ? 'flex' : 'none';
        document.getElementById('search-input').value = '';

        if (tab === 'pending') loadReports();
        else if (tab === 'history') loadHistory();
        else if (tab === 'banned') loadBanned();
        else if (tab === 'users') loadUsers();
    }

    function showToast(msg, isErr = false) {
        const c = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = `toast ${isErr ? 'error' : ''} show`; t.innerText = msg;
        c.appendChild(t);
        setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
    }

    function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }

    // --- ACTIONS SUR CONTENU ---
    async function deletePost(postId) {
        if (!confirm('Supprimer cette publication ?')) return;
        await apiFetch('/api/admin/post/' + postId, { method: 'DELETE' });
        showToast("Publication supprimée."); loadReports();
    }
    
    async function deleteComment(commentId) {
        if (!confirm('Supprimer ce commentaire ?')) return;
        await apiFetch('/api/admin/comment/' + commentId, { method: 'DELETE' });
        showToast("Commentaire supprimé."); loadReports();
    }

    async function restorePost(postId) {
        await apiFetch('/api/admin/post/' + postId + '/restore', { method: 'PUT' });
        showToast("Signalement ignoré."); loadReports();
    }

    // --- MODALES (RAPPORTS ET POST D'ORIGINE) ---
    function openReportDetails(index) {
        const report = currentFilteredReports[index];
        let html = '';
        report.details_signalements.forEach(s => {
            const dateObj = new Date(s.date_signalement);
            const dateStr = dateObj.toLocaleDateString('fr-FR') + ' à ' + dateObj.toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
            const plaignant = (s.est_automatique || !s.plaignant) ? '🤖 Système IA' : s.plaignant;
            html += `<li><strong>Motif :</strong> <span style="color:#ed4956">${s.motif}</span><br><br><span style="color:#a8a8a8">Signalé par <strong>${plaignant}</strong> le ${dateStr}</span></li>`;
        });
        document.getElementById('reports-detail-list').innerHTML = html;
        document.getElementById('reports-modal-overlay').style.display = 'flex';
    }

    function openOriginalPost(index) {
        const r = currentFilteredReports[index];
        let img = r.nom_fichier_photo ? `<img src="${r.nom_fichier_photo}" class="post-image" style="margin-top:10px;">` : '';
        document.getElementById('original-post-content').innerHTML = `
            <span class="post-author" onclick="openStatsModal(${r.id_auteur}, '${r.auteur}')">@${r.auteur} 🔍</span>
            <p class="post-text">${r.texte_description || '<em>Média uniquement</em>'}</p>
            ${img}
        `;
        document.getElementById('original-post-modal-overlay').style.display = 'flex';
    }

    // --- ACTIONS COMPTES ---
    function openBanModal(userId) { userToBanId = userId; document.getElementById('ban-modal-overlay').style.display = 'flex'; }

    async function confirmBan() {
        const motif = document.getElementById('ban-motif').value;
        const dur = document.getElementById('ban-duration').value;
        if (!motif) return showToast("Motif obligatoire.", true);
        const est_definitif = (dur === 'lifetime');
        const res = await apiFetch('/api/admin/user/' + userToBanId + '/ban', {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ motif, duree_jour: est_definitif ? 9999 : parseInt(dur), est_definitif })
        });
        closeModals();
        if (res.ok) { showToast("Compte banni."); switchTab(currentTab); } else { const d = await res.json(); showToast(d.error, true); }
    }

    async function unbanUser(banId) {
        if (!confirm("Débannir ce compte ?")) return;
        const res = await apiFetch('/api/admin/ban/' + banId, { method: 'DELETE' });
        if(res.ok) { showToast("Restriction levée !"); loadBanned(); }
    }
    
    async function deleteAccount(userId) {
        if (!confirm("Supprimer ce compte DÉFINITIVEMENT ?")) return;
        const res = await apiFetch('/api/admin/user/' + userId, { method: 'DELETE' });
        if(res.ok) { showToast("Compte supprimé."); closeModals(); switchTab(currentTab); }
    }

    async function changeUserRole(userId, newRole) {
        if (!confirm(`Passer cet utilisateur en ${newRole} ?`)) return;
        const res = await apiFetch('/api/admin/user/' + userId + '/role', {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role: newRole })
        });
        if(res.ok) { showToast("Rôle mis à jour."); closeModals(); if(currentTab === 'users') loadUsers(); }
    }

    async function openStatsModal(userId, pseudo) {
        const res = await apiFetch('/api/admin/user/' + userId + '/stats');
        const stats = await res.json();
        document.getElementById('stats-title').innerText = "Compte de @" + pseudo;
        
        let color = stats.role === 'admin' ? '#ed4956' : (stats.role === 'moderateur' ? '#0095f6' : '#363636');
        document.getElementById('role-badge').innerHTML = `<span class="badge-success" style="background:${color};color:white;">Rôle: ${stats.role}</span>`;
        document.getElementById('stat-reports').innerText = stats.reports;
        document.getElementById('stat-deleted').innerText = stats.deletedPosts;
        document.getElementById('stat-bans').innerText = stats.bans;
        
        const adminDiv = document.getElementById('admin-actions');
        const roleDiv = document.getElementById('role-management');
        const deleteBtn = document.getElementById('btn-delete-account');
        
        if (getCurrentRole() === 'admin') {
            adminDiv.style.display = 'flex';
            deleteBtn.onclick = () => deleteAccount(userId);
            
            if (stats.role === 'admin') roleDiv.innerHTML = `<div style="color:#a8a8a8;font-size:12px;">Impossible de modifier un autre Admin.</div>`;
            else if (stats.role === 'moderateur') roleDiv.innerHTML = `<button class="btn btn-warning" style="width:100%" onclick="changeUserRole(${userId}, 'user')">Rétrograder en Utilisateur normal</button>`;
            else roleDiv.innerHTML = `<button class="btn btn-primary" style="width:100%" onclick="changeUserRole(${userId}, 'moderateur')">🌟 Nommer Modérateur</button>`;
        } else adminDiv.style.display = 'none';
        
        document.getElementById('stats-modal-overlay').style.display = 'flex';
    }

    // --- CHARGEMENT ET RENDU SÉCURISÉ ---
    async function loadReports() {
        const res = await apiFetch('/api/admin/reports');
        const data = await res.json();
        
        if (!Array.isArray(data)) {
            showToast("Erreur API : " + (data.error || "Problème serveur"), true);
            allReports = [];
        } else {
            allReports = data;
        }
        renderReports();
    }

    function renderReports() {
        const type = document.getElementById('filter-type').value;
        const sort = document.getElementById('sort-type').value;
        
        let filtered = allReports;
        
        if (type === 'ia') {
            filtered = filtered.filter(r => r.details_signalements.some(s => s.est_automatique == 1 || !s.plaignant));
        } else if (type === 'human') {
            filtered = filtered.filter(r => r.details_signalements.some(s => s.est_automatique == 0 && s.plaignant));
        }

        if (sort === 'count') {
            filtered.sort((a, b) => b.total_reports - a.total_reports);
        } else {
            filtered.sort((a, b) => {
                let maxA = Math.max(...a.details_signalements.map(s => new Date(s.date_signalement).getTime()));
                let maxB = Math.max(...b.details_signalements.map(s => new Date(s.date_signalement).getTime()));
                return maxB - maxA;
            });
        }
        
        currentFilteredReports = filtered; // Sauvegarde pour les fenêtres modales

        const grid = document.getElementById('reports-list');
        grid.innerHTML = filtered.length ? '' : `<div class="empty-state"><div class="empty-icon">✨</div><h3>Rien à signaler</h3></div>`;

        filtered.forEach((r, index) => {
            const dates = r.details_signalements.map(s => new Date(s.date_signalement).getTime());
            const mostRecent = new Date(Math.max(...dates));
            const dateStr = mostRecent.toLocaleDateString('fr-FR') + ' ' + mostRecent.toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
            
            let img = r.nom_fichier_photo ? `<img src="${r.nom_fichier_photo}" class="post-image">` : '';
            const banBtn = (getCurrentRole() === 'admin') ? `<button class="btn btn-warning" onclick="openBanModal(${r.id_auteur})">Bannir</button>` : '';
            
            let contentHtml = '';
            let actionBtn = '';
            
            if (r.id_commentaire) {
                // AFFICHAGE POUR UN COMMENTAIRE (Avec bouton "Voir le post")
                contentHtml = `
                    <div class="context-box">
                        <div>Sur le post de @${r.auteur} : "${r.texte_description.substring(0, 50)}..."</div>
                        <button class="btn btn-primary" style="padding: 6px; font-size: 11px; width: fit-content;" onclick="openOriginalPost(${index})">👁️ Voir le post d'origine</button>
                    </div>
                    <span class="post-author" onclick="openStatsModal(${r.id_auteur_com}, '${r.auteur_com}')">🗨️ Commentaire de @${r.auteur_com} 🔍</span>
                    <p class="post-text">${r.contenu_commentaire}</p>
                `;
                actionBtn = `<button class="btn btn-danger" onclick="deleteComment(${r.id_commentaire})">Suppr. Com</button>`;
            } else {
                // AFFICHAGE POUR UN POST
                contentHtml = `
                    <span class="post-author" onclick="openStatsModal(${r.id_auteur}, '${r.auteur}')">📝 Post de @${r.auteur} 🔍</span>
                    <p class="post-text">${r.texte_description || '<em>Média uniquement</em>'}</p>${img}
                `;
                actionBtn = `<button class="btn btn-danger" onclick="deletePost(${r.id_publication})">Suppr. Post</button>`;
            }

            grid.innerHTML += `
                <div class="report-card">
                    <div class="card-header">
                        <span class="badge-motif">${r.details_signalements[0].motif} ${r.total_reports > 1 ? '(+)' : ''}</span>
                        <div style="text-align:right;">
                            <span class="date">${dateStr}</span><br>
                            <span class="badge-warning" onclick="openReportDetails(${index})" title="Cliquer pour voir les détails">Signalé ${r.total_reports} fois</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="post-preview">${contentHtml}</div>
                    </div>
                    <div class="card-actions">
                        ${actionBtn}
                        ${banBtn}
                        <button class="btn btn-success" onclick="restorePost(${r.id_publication})">Ignorer</button>
                    </div>
                </div>`;
        });
    }

    async function loadHistory() {
        const res = await apiFetch('/api/admin/history');
        const data = await res.json();
        const history = Array.isArray(data) ? data : [];
        const grid = document.getElementById('reports-list');
        grid.innerHTML = history.length ? '' : `<div class="empty-state"><div class="empty-icon">📂</div><h3>Historique vide</h3></div>`;
        history.forEach(item => {
            const dateStr = new Date(item.date_signalement).toLocaleDateString('fr-FR') + ' ' + new Date(item.date_signalement).toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
            const isIA = (item.est_automatique == 1 || !item.plaignant);
            grid.innerHTML += `<div class="report-card"><div class="card-header"><span class="badge-success">${item.statut}</span><span class="date">${dateStr}</span></div><div class="card-body"><div class="reporter-info">Motif : <strong>${item.motif}</strong></div><div class="reporter-info">Signalé par : ${isIA ? `🤖 IA` : item.plaignant}</div><div class="reporter-info">Cible : <span class="post-author" onclick="openStatsModal(${item.id_auteur}, '${item.auteur}')">@${item.auteur} 🔍</span></div></div></div>`;
        });
    }

    async function loadBanned() {
        const res = await apiFetch('/api/admin/banned-users');
        const data = await res.json();
        allBannedUsers = Array.isArray(data) ? data : [];
        renderSearch(allBannedUsers, 'banned');
    }

    async function loadUsers() {
        const res = await apiFetch('/api/admin/users');
        const data = await res.json();
        allUsersList = Array.isArray(data) ? data : [];
        renderSearch(allUsersList, 'users');
    }

    function handleSearch() {
        const term = document.getElementById('search-input').value.toLowerCase();
        if (currentTab === 'banned') renderSearch(allBannedUsers.filter(u => u.pseudonyme.toLowerCase().includes(term) || u.motif.toLowerCase().includes(term)), 'banned');
        if (currentTab === 'users') renderSearch(allUsersList.filter(u => u.pseudonyme.toLowerCase().includes(term) || u.role.toLowerCase().includes(term)), 'users');
    }

    function renderSearch(list, type) {
        const grid = document.getElementById('reports-list');
        grid.innerHTML = list.length ? '' : `<div class="empty-state"><div class="empty-icon">👻</div><h3>Aucun résultat</h3></div>`;
        
        list.forEach(item => {
            if (type === 'banned') {
                const isLife = item.est_definitif;
                let endStr = isLife ? "Jamais" : new Date(new Date(item.date_debut).getTime() + item.duree_jour*86400000).toLocaleDateString('fr-FR');
                const unbanBtn = (getCurrentRole() === 'admin') ? `<button class="btn btn-success" onclick="unbanUser(${item.id_bannissement})">Lever la restriction</button>` : `<div style="color:#a8a8a8;font-size:12px;text-align:center;padding:10px;">Seul un Admin peut gérer les restrictions.</div>`;
                grid.innerHTML += `<div class="report-card"><div class="card-header"><span class="${isLife?'badge-motif':'badge-warning'}">${isLife?"À vie":item.duree_jour+" jours"}</span><span class="date">Fin : ${endStr}</span></div><div class="card-body"><div class="post-preview"><span class="post-author" onclick="openStatsModal(${item.id_utilisateur}, '${item.pseudonyme}')">@${item.pseudonyme} 🔍</span><p class="post-text">Raison : <strong>${item.motif}</strong></p></div></div><div class="card-actions">${unbanBtn}</div></div>`;
            } else {
                let badge = item.role === 'admin' ? '<span class="badge-motif">Admin</span>' : (item.role === 'moderateur' ? '<span class="badge-ia">Modérateur</span>' : '<span class="badge-success" style="background:#363636;color:white;">User</span>');
                grid.innerHTML += `<div class="report-card"><div class="card-header">${badge}<span class="date">Bans: ${item.nombre_de_bannissement}</span></div><div class="card-body" style="align-items:center; text-align:center;"><span class="post-author" style="font-size:20px; margin:20px 0;">@${item.pseudonyme}</span></div><div class="card-actions"><button class="btn btn-primary" onclick="openStatsModal(${item.id_utilisateur}, '${item.pseudonyme}')">Gérer le compte</button></div></div>`;
            }
        });
    }

    loadReports();
    changeRole();
</script>
</body>
</html>
