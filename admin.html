<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Centre de Modération</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #050505; color: #f5f5f5; padding: 40px 20px; }
        
        .header { max-width: 1200px; margin: 0 auto 30px; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 28px; font-weight: 700; }
        
        .tabs { display: flex; gap: 15px; }
        .tab-btn { background: transparent; border: none; color: #a8a8a8; font-size: 16px; font-weight: 600; cursor: pointer; padding-bottom: 5px; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #fff; border-bottom: 2px solid #0095f6; }
        
        .reports-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        
        .report-card { background: #121212; border: 1px solid #262626; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
        .card-header { padding: 15px 20px; border-bottom: 1px solid #262626; display: flex; justify-content: space-between; align-items: center; background: #0a0a0a; }
        .badge-motif { background: rgba(237, 73, 86, 0.15); color: #ed4956; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-success { background: rgba(92, 184, 92, 0.15); color: #5cb85c; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .date { color: #a8a8a8; font-size: 12px; }
        
        .card-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; gap: 15px; }
        .reporter-info { font-size: 13px; color: #a8a8a8; }
        .reporter-info strong { color: #fff; }
        
        .post-preview { background: #000; border: 1px solid #262626; border-radius: 12px; padding: 15px; }
        .post-author { font-size: 14px; font-weight: 600; margin-bottom: 10px; display: inline-block; text-decoration: none; color: #0095f6; cursor: pointer; }
        .post-author:hover { text-decoration: underline; }
        .post-text { font-size: 14px; line-height: 1.4; color: #e0e0e0; margin-bottom: 10px; }
        .post-image { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; border: 1px solid #262626; }
        
        .card-actions { padding: 15px 20px; border-top: 1px solid #262626; display: flex; gap: 10px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.8; }
        .btn-danger { background: #ed4956; color: white; }
        .btn-warning { background: #363636; color: #f0ad4e; }
        .btn-success { background: #5cb85c; color: white; }
        
        .empty-state { text-align: center; padding: 60px; color: #a8a8a8; grid-column: 1 / -1; }
        .empty-icon { font-size: 40px; margin-bottom: 15px; }

        /* MODALES (Fenêtres superposées) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal { background: #121212; border: 1px solid #262626; border-radius: 16px; padding: 25px; width: 380px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal h3 { font-size: 18px; border-bottom: 1px solid #262626; padding-bottom: 10px; }
        .modal input, .modal select { background: #000; border: 1px solid #363636; color: white; padding: 12px; border-radius: 8px; width: 100%; outline: none; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
        
        /* Stats Utilisateur */
        .stats-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .stats-list li { background: #000; padding: 12px; border-radius: 8px; border: 1px solid #262626; display: flex; justify-content: space-between; font-size: 14px; }
        .stats-list strong { color: #ed4956; font-size: 16px; }

        #toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 3000; }
        .toast { background: #5cb85c; color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; opacity: 0; transform: translateY(20px); transition: all 0.3s ease; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: #ed4956; }
    </style>
</head>
<body>

<div class="header">
    <h1>🚨 Modération</h1>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('pending')" id="tab-pending">En attente</button>
        <button class="tab-btn" onclick="switchTab('history')" id="tab-history">Historique</button>
    </div>
</div>

<div class="reports-grid" id="reports-list"></div>
<div id="toast-container"></div>

<!-- Modal : Bannissement -->
<div id="ban-modal-overlay" class="modal-overlay">
    <div class="modal">
        <h3>🔨 Bannir l'utilisateur</h3>
        <input type="text" id="ban-motif" placeholder="Motif officiel du bannissement..." autocomplete="off"/>
        <select id="ban-duration">
            <option value="7">1 Semaine</option>
            <option value="30">1 Mois</option>
            <option value="lifetime">Définitivement (À vie)</option>
        </select>
        <div class="modal-actions">
            <button class="btn btn-warning" onclick="closeModals()">Annuler</button>
            <button class="btn btn-danger" onclick="confirmBan()">Confirmer le Ban</button>
        </div>
    </div>
</div>

<!-- Modal : Casier (Stats Utilisateur) -->
<div id="stats-modal-overlay" class="modal-overlay">
    <div class="modal">
        <h3 id="stats-title">Profil Modération</h3>
        <ul class="stats-list">
            <li>Signalements contre lui : <strong id="stat-reports">0</strong></li>
            <li>Posts supprimés par le staff : <strong id="stat-deleted">0</strong></li>
            <li>Bannissements passés : <strong id="stat-bans">0</strong></li>
        </ul>
        <button class="btn btn-warning" onclick="closeModals()">Fermer</button>
    </div>
</div>

<script>
    let currentTab = 'pending';
    let userToBanId = null;

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab-pending').classList.toggle('active', tab === 'pending');
        document.getElementById('tab-history').classList.toggle('active', tab === 'history');
        tab === 'pending' ? loadReports() : loadHistory();
    }

    function showToast(message, isError = false) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${isError ? 'error' : ''} show`;
        toast.innerText = message;
        container.appendChild(toast);
        setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    // GESTION DES MODALES
    function closeModals() {
        document.getElementById('ban-modal-overlay').style.display = 'none';
        document.getElementById('stats-modal-overlay').style.display = 'none';
        document.getElementById('ban-motif').value = '';
    }

    function openBanModal(userId) {
        userToBanId = userId;
        document.getElementById('ban-modal-overlay').style.display = 'flex';
    }

    async function confirmBan() {
        const motif = document.getElementById('ban-motif').value;
        const durationSelect = document.getElementById('ban-duration').value;
        
        if (!motif) return showToast("Veuillez entrer un motif.", true);
        
        const est_definitif = (durationSelect === 'lifetime');
        const duree_jour = est_definitif ? 9999 : parseInt(durationSelect);

        const res = await fetch('/api/admin/user/' + userToBanId + '/ban', {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ motif, duree_jour, est_definitif })
        });
        
        closeModals();
        if (res.ok) {
            showToast(est_definitif ? "Utilisateur banni à vie." : `Utilisateur banni pour ${duree_jour} jours.`);
            loadReports();
        } else {
            const data = await res.json();
            showToast(data.error, true);
        }
    }

    async function openStatsModal(userId, pseudo) {
        const res = await fetch('/api/admin/user/' + userId + '/stats');
        const stats = await res.json();
        
        document.getElementById('stats-title').innerText = "Casier de @" + pseudo;
        document.getElementById('stat-reports').innerText = stats.reports;
        document.getElementById('stat-deleted').innerText = stats.deletedPosts;
        document.getElementById('stat-bans').innerText = stats.bans;
        
        document.getElementById('stats-modal-overlay').style.display = 'flex';
    }

    // CHARGEMENT DES DONNÉES
    async function loadReports() {
        const res = await fetch('/api/admin/reports');
        const reports = await res.json();
        const grid = document.getElementById('reports-list');
        grid.innerHTML = '';

        if (reports.length === 0) return grid.innerHTML = `<div class="empty-state"><div class="empty-icon">✨</div><h3>Aucun signalement</h3></div>`;

        reports.forEach(report => {
            const dateStr = new Date(report.date_signalement).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
            let imageHtml = report.nom_fichier_photo ? `<img src="${report.nom_fichier_photo}" class="post-image">` : '';

            grid.innerHTML += `
                <div class="report-card">
                    <div class="card-header">
                        <span class="badge-motif">${report.motif}</span>
                        <span class="date">${dateStr}</span>
                    </div>
                    <div class="card-body">
                        <div class="reporter-info">Signalé par <strong>${report.plaignant}</strong></div>
                        <div class="post-preview">
                            <span class="post-author" onclick="openStatsModal(${report.id_auteur}, '${report.auteur}')">@${report.auteur} 🔍</span>
                            <p class="post-text">${report.texte_description || '<em>Média uniquement</em>'}</p>
                            ${imageHtml}
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-danger" onclick="deletePost(${report.id_publication})">Supprimer post</button>
                        <button class="btn btn-warning" onclick="openBanModal(${report.id_auteur})">Bannir</button>
                        <button class="btn btn-success" onclick="restorePost(${report.id_publication})">Ignorer</button>
                    </div>
                </div>
            `;
        });
    }

    async function loadHistory() {
        const res = await fetch('/api/admin/history');
        const history = await res.json();
        const grid = document.getElementById('reports-list');
        grid.innerHTML = '';

        if (history.length === 0) return grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📂</div><h3>Historique vide</h3></div>`;

        history.forEach(item => {
            const dateStr = new Date(item.date_signalement).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
            grid.innerHTML += `
                <div class="report-card">
                    <div class="card-header">
                        <span class="badge-success">${item.statut}</span>
                        <span class="date">${dateStr}</span>
                    </div>
                    <div class="card-body">
                        <div class="reporter-info">Motif : <strong>${item.motif}</strong></div>
                        <div class="reporter-info">Signalé par : ${item.plaignant}</div>
                        <div class="reporter-info" style="margin-top: 10px;">
                            Auteur ciblé : <span class="post-author" onclick="openStatsModal(${item.id_auteur}, '${item.auteur}')">@${item.auteur} 🔍</span>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    async function deletePost(postId) {
        if (!confirm('Supprimer définitivement ?')) return;
        await fetch('/api/admin/post/' + postId, { method: 'DELETE' });
        showToast("Publication supprimée.");
        loadReports();
    }

    async function restorePost(postId) {
        await fetch('/api/admin/post/' + postId + '/restore', { method: 'PUT' });
        showToast("Signalement ignoré.");
        loadReports();
    }

    loadReports();
</script>
</body>
</html>
