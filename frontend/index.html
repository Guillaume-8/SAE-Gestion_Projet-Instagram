<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaClone - BUT R&T</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <h1 class="logo">InstaClone</h1>
      <nav class="nav-menu">
        <button id="btn-feed" class="btn-nav active">Fil</button>
        <button id="btn-explore" class="btn-nav">Tendances</button>
        <button id="btn-messages" class="btn-nav">Messages</button>
        <button id="btn-profile" class="btn-nav">Profil</button>
      </nav>
    </div>
  </header>

  <main class="feed-container">
    <section id="posts-container" class="posts-list">
      <!-- Les publications seront injectées ici dynamiquement -->
    </section>
  </main>

  <script type="module" src="js/feed.js"></script>
</body>
</html>
