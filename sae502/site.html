<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Messagerie Instagram</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #fafafa; padding: 20px; }
    .chat-card { max-width: 450px; margin: auto; background: white; border: 1px solid #dbdbdb; border-radius: 8px; padding: 15px; }
    #chat-box { height: 280px; border: 1px solid #efefef; overflow-y: auto; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
    .msg { margin-bottom: 8px; padding: 8px 12px; border-radius: 12px; width: fit-content; max-width: 75%; word-break: break-word; }
    .me { background: #0095f6; color: white; margin-left: auto; }
    .other { background: #efefef; color: black; }
    .typing { height: 16px; font-size: 0.85em; color: #8e8e8e; font-style: italic; }
    .inputs { display: flex; gap: 6px; }
    input[type="text"] { flex: 1; padding: 8px; border: 1px solid #dbdbdb; border-radius: 4px; }
    button { background: #0095f6; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

<div class="chat-card">
  <h3>Chat Direct & Groupe</h3>
  <div style="margin-bottom: 10px;">
    <input type="text" id="pseudonyme" placeholder="Ton Pseudo (ex: Enes)" style="width: 130px;">
    <input type="number" id="idGroupe" placeholder="ID Groupe (ex: 101)" style="width: 110px;">
    <button onclick="joinGroup()">Rejoindre</button>
  </div>

  <div id="chat-box"></div>
  <div id="typing" class="typing"></div>

  <div class="inputs">
    <input type="text" id="msgInput" placeholder="Écris ton message..." oninput="onTyping()">
    <button onclick="send()">Envoyer</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let timer;

  async function joinGroup() {
    const idGroupe = parseInt(document.getElementById('idGroupe').value);
    const pseudonyme = document.getElementById('pseudonyme').value.trim();

    if (!idGroupe || !pseudonyme) return alert("Remplis ton pseudo et l'ID du groupe");

    socket.emit('join_group', idGroupe);

    const res = await fetch(`/api/messages/${idGroupe}`);
    const history = await res.json();
    
    const box = document.getElementById('chat-box');
    box.innerHTML = `<p style="text-align:center; color:#8e8e8e; font-size:0.8em;">Groupe ${idGroupe} rejoint</p>`;

    history.forEach(msg => renderMessage(msg));
  }

  function send() {
    const input = document.getElementById('msgInput');
    const contenu = input.value.trim();
    const pseudonyme = document.getElementById('pseudonyme').value.trim();
    const idGroupe = parseInt(document.getElementById('idGroupe').value);

    if (!contenu) return;

    socket.emit('send_message', {
      pseudonyme: pseudonyme,
      idGroupe: idGroupe,
      idNotification: null,
      contenu: contenu
    });

    input.value = '';
    socket.emit('typing_stop', { idGroupe, pseudonyme });
  }

  socket.on('receive_message', (msg) => {
    renderMessage(msg);
  });

  function renderMessage(msg) {
    const currentPseudo = document.getElementById('pseudonyme').value.trim();
    const box = document.getElementById('chat-box');
    const isMe = msg.Pseudonyme_utilisateur === currentPseudo;

    box.innerHTML += `
      <div class="msg ${isMe ? 'me' : 'other'}">
        <small style="display:block; font-size:0.7em; opacity:0.8;">${msg.Pseudonyme_utilisateur}</small>
        ${msg.Contenu_message}
      </div>
    `;
    box.scrollTop = box.scrollHeight;
  }

  function onTyping() {
    const pseudonyme = document.getElementById('pseudonyme').value.trim();
    const idGroupe = parseInt(document.getElementById('idGroupe').value);

    socket.emit('typing_start', { idGroupe, pseudonyme });
    clearTimeout(timer);
    timer = setTimeout(() => {
      socket.emit('typing_stop', { idGroupe, pseudonyme });
    }, 1500);
  }

  socket.on('user_typing', (data) => {
    const currentPseudo = document.getElementById('pseudonyme').value.trim();
    const indicator = document.getElementById('typing');
    if (data.pseudonyme !== currentPseudo && data.isTyping) {
      indicator.innerText = `${data.pseudonyme} écrit...`;
    } else {
      indicator.innerText = '';
    }
  });
</script>

</body>
</html>
