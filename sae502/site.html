<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Messagerie Instagram - DM & Groupes</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #fafafa; padding: 20px; }
    .chat-card { max-width: 480px; margin: auto; background: white; border: 1px solid #dbdbdb; border-radius: 8px; padding: 15px; }
    .section { background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #e9ecef; }
    #chat-box { height: 250px; border: 1px solid #efefef; overflow-y: auto; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
    .msg { margin-bottom: 8px; padding: 8px 12px; border-radius: 12px; width: fit-content; max-width: 75%; }
    .me { background: #0095f6; color: white; margin-left: auto; }
    .other { background: #efefef; color: black; }
    .typing { height: 16px; font-size: 0.85em; color: #8e8e8e; font-style: italic; }
    .inputs { display: flex; gap: 6px; }
    input[type="text"] { padding: 6px; border: 1px solid #dbdbdb; border-radius: 4px; }
    button { background: #0095f6; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

<div class="chat-card">
  <h3>Instagram Direct</h3>

  <!-- Identifiant utilisateur -->
  <div style="margin-bottom: 10px;">
    <label><b>Mon Pseudo :</b></label>
    <input type="text" id="pseudonyme" placeholder="ex: Enes">
  </div>

  <!-- Option A : DM 1-à-1 -->
  <div class="section">
    <small><b>Message Privé (1-à-1)</b></small><br>
    <input type="text" id="targetUser" placeholder="Pseudo du destinataire">
    <button onclick="startDM()">Discuter</button>
  </div>

  <!-- Option B : Créer un Groupe -->
  <div class="section">
    <small><b>Créer un Groupe</b></small><br>
    <input type="text" id="groupMembers" placeholder="Membres (séparés par une virgule)">
    <button onclick="createGroup()">Créer Groupe</button>
  </div>

  <hr>

  <!-- Zone de Discussion -->
  <div id="chat-header" style="font-weight: bold; font-size: 0.9em; margin-bottom: 5px; color: #555;">Aucune discussion active</div>
  <div id="chat-box"></div>
  <div id="typing" class="typing"></div>

  <div class="inputs">
    <input type="text" id="msgInput" placeholder="Message..." oninput="onTyping()" style="flex:1;">
    <button onclick="send()">Envoyer</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let currentGroupId = null;
  let timer;

  // Lancer un DM 1-à-1
  async function startDM() {
    const myPseudo = document.getElementById('pseudonyme').value.trim();
    const targetPseudo = document.getElementById('targetUser').value.trim();

    if (!myPseudo || !targetPseudo) return alert("Remplis ton pseudo et celui du destinataire");

    const res = await fetch('/api/dm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pseudo1: myPseudo, pseudo2: targetPseudo })
    });

    const data = await res.json();
    openChat(data.idGroupe, `Discussion avec ${targetPseudo}`);
  }

  // Créer un groupe
  async function createGroup() {
    const myPseudo = document.getElementById('pseudonyme').value.trim();
    const membersInput = document.getElementById('groupMembers').value.trim();

    if (!myPseudo || !membersInput) return alert("Remplis ton pseudo et la liste des membres");

    const membres = membersInput.split(',').map(m => m.trim());

    const res = await fetch('/api/groupe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ createur: myPseudo, membres: membres })
    });

    const data = await res.json();
    openChat(data.idGroupe, `Groupe (${membres.length + 1} membres)`);
  }

  // Ouvrir un salon de discussion (DM ou Groupe)
  async function openChat(idGroupe, title) {
    currentGroupId = idGroupe;
    document.getElementById('chat-header').innerText = title;

    socket.emit('join_group', idGroupe);

    const res = await fetch(`/api/messages/${idGroupe}`);
    const history = await res.json();

    const box = document.getElementById('chat-box');
    box.innerHTML = '';
    history.forEach(msg => renderMessage(msg));
  }

  function send() {
    if (!currentGroupId) return alert("Ouvre d'abord un DM ou un groupe !");

    const input = document.getElementById('msgInput');
    const contenu = input.value.trim();
    const pseudonyme = document.getElementById('pseudonyme').value.trim();

    if (!contenu) return;

    socket.emit('send_message', {
      pseudonyme: pseudonyme,
      idGroupe: currentGroupId,
      idNotification: null,
      contenu: contenu
    });

    input.value = '';
    socket.emit('typing_stop', { idGroupe: currentGroupId, pseudonyme });
  }

  socket.on('receive_message', (msg) => {
    if (msg.id_groupe === currentGroupId) {
      renderMessage(msg);
    }
  });

  function renderMessage(msg) {
    const currentPseudo = document.getElementById('pseudonyme').value.trim();
    const box = document.getElementById('chat-box');
    const isMe = msg.Pseudonyme_utilisateur === currentPseudo;

    box.innerHTML += `
      <div class="msg ${isMe ? 'me' : 'other'}">
        <small style="display:block; font-size:0.7em; opacity:0.8;">${msg.Pseudonyme_utilisateur}</small>
        ${msg.Contenu_message}
      </div>
    `;
    box.scrollTop = box.scrollHeight;
  }

  function onTyping() {
    if (!currentGroupId) return;
    const pseudonyme = document.getElementById('pseudonyme').value.trim();

    socket.emit('typing_start', { idGroupe: currentGroupId, pseudonyme });
    clearTimeout(timer);
    timer = setTimeout(() => {
      socket.emit('typing_stop', { idGroupe: currentGroupId, pseudonyme });
    }, 1500);
  }

  socket.on('user_typing', (data) => {
    const currentPseudo = document.getElementById('pseudonyme').value.trim();
    const indicator = document.getElementById('typing');
    if (data.idGroupe === currentGroupId && data.pseudonyme !== currentPseudo && data.isTyping) {
      indicator.innerText = `${data.pseudonyme} écrit...`;
    } else {
      indicator.innerText = '';
    }
  });
</script>

</body>
</html>
